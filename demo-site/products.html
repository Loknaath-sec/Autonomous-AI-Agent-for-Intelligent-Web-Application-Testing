<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <style>body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; } nav { display:flex; justify-content:space-between; padding:20px 40px; background:#0f172a; color:white; } nav a { color:white; margin:0 10px; text-decoration:none; } .container { max-width: 1100px; margin: 30px auto; } .grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:20px; } .product { background:white; border-radius:12px; border:1px solid #e2e8f0; padding:20px; } .button { background: #06b6d4; color:black; padding:10px 16px; border:none; border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; } .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; } input { padding:10px; border: 1px solid #cbd5e1; border-radius:8px; width: 60%; } </style>
  </head>
  <body>
    <nav>
      <div><strong>DemoStore</strong></div>
      <div><a href="index.html">Home</a><a href="login.html">Login</a><a href="cart.html">Cart</a></div>
    </nav>
    <div class="container">
      <div class="toolbar">
        <h1>Products</h1>
        <input type="text" value="laptop" id="search-input" />
        <button class="button" id="search-btn">Search</button>
      </div>
      <div class="grid">
        <div class="product">
          <h3>Laptop Pro</h3>
          <p>$1299</p>
          <a class="button" href="product-details.html?id=laptop-pro">View details</a>
        </div>
        <div class="product">
          <h3>Gaming Laptop</h3>
          <p>$1699</p>
          <a class="button" href="product-details.html?id=gaming-laptop">View details</a>
        </div>
        <div class="product">
          <h3>USB-C Hub</h3>
          <p>$59</p>
          <a class="button" href="product-details.html?id=hub">View details</a>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('search-btn').addEventListener('click', () => {
        const value = document.getElementById('search-input').value.toLowerCase();
        if (value.includes('laptop')) {
          window.location.href = 'products.html?search=laptop';
        } else {
          alert('No items found');
        }
      });
    </script>
  </body>
</html>
