<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product details</title>
    <style>body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; } nav { display:flex; justify-content:space-between; padding:20px 40px; background:#0f172a; color:white; } nav a { color:white; margin:0 10px; text-decoration:none; } .container { max-width: 900px; margin: 50px auto; background: white; border-radius: 12px; padding: 30px; } .button { background:#06b6d4; color:black; padding:10px 16px; border:none; border-radius:8px; cursor:pointer; } .button.secondary { background:#e2e8f0; } .meta { color: #475569; margin-bottom: 20px; } #cart-count { font-weight: bold; } </style>
  </head>
  <body>
    <nav>
      <div><strong>DemoStore</strong></div>
      <div><a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart</a></div>
    </nav>
    <div class="container">
      <div class="meta">Product / Laptop Pro</div>
      <h1>Laptop Pro</h1>
      <p>Powerful laptop for research, coding, and productivity.</p>
      <p><strong>$1299</strong></p>
      <button id="add-to-cart" class="button">Add to cart</button>
      <a class="button secondary" href="review.html">Read review</a>
      <p id="cart-count">Cart count: 0</p>
    </div>
    <script>
      const cartCount = localStorage.getItem('cart-count') || '0';
      document.getElementById('cart-count').textContent = `Cart count: ${cartCount}`;
      document.getElementById('add-to-cart').addEventListener('click', () => {
        const current = Number(localStorage.getItem('cart-count') || '0');
        const next = current + 1;
        localStorage.setItem('cart-count', String(next));
        document.getElementById('cart-count').textContent = `Cart count: ${next}`;
      });
    </script>
  </body>
</html>
